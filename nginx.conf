server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    location = /feed.xml {
        types { }
        default_type application/rss+xml;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
